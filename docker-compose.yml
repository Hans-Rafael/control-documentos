version: '3.8'

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n_local
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Argentina/Buenos_Aires
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      - n8n_data:/home/node/.n8n
      # Recuerda poner tu usuario real de Mint aquí:
      - /home/tu_usuario/Documentos:/files/Documentos:ro
    extra_hosts:
      - "host.docker.internal:host-gateway" # Permite a n8n comunicarse con el Ollama nativo de tu PC

volumes:
  n8n_data: